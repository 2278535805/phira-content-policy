name: 版权方声明
description: 版权方 / 发行方本人就旗下曲目在 Phira 的使用提出要求（禁止、受限或允许）。
title: "[版权方声明] "
labels: ["rights-holder", "declaration"]
body:
  - type: markdown
    attributes:
      value: |
        **请仅由版权方本人或其正式授权代表填写。** 本数据库记录的是版权方对曲目在 Phira 上使用的官方态度，因此需要核实身份。

  - type: input
    id: holder-name
    attributes:
      label: 版权方名称
      description: 你的公司 / 厂牌 / 团队名称。
      placeholder: 例如：lowiro
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 用于维护者核实身份的邮箱 / 官方账号 / 官网等（如 B站、微博、微信公众号等）。
      placeholder: 例如：official@example.com
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: 声明内容
      description: 你希望如何标记旗下曲目？
      options:
        - 禁止使用（forbidden）
        - 受限使用（restricted，请说明限制条件）
        - 允许使用（free）
        - 仅针对部分曲目（请在下方说明）
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 适用范围
      description: 该声明适用于哪些曲目？全部旗下曲目，还是仅特定曲目 / 曲包？
      placeholder: 例如：适用于全部旗下曲目；或仅适用于《XXX》曲包。
    validations:
      required: true

  - type: textarea
    id: conditions
    attributes:
      label: 限制条件（如适用）
      description: 若为 restricted，请说明具体限制（如仅允许翻唱、禁止剪辑、需标注来源等）。
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 官方声明链接
      description: 若该声明已在官网 / 社交媒体发布，请附上链接以便存档。
      placeholder: |
        - https://...
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 身份确认
      options:
        - label: 我确认我是该版权方的正式代表，有权就曲目使用作出声明
          required: true
        - label: 我同意维护者就身份核实事宜与我联系
          required: true
